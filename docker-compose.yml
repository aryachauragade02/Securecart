# SecureCart: a security-hardened demo store.
#   docker compose up -d --build
#   Store:            http://localhost:3000
#   TestPay sandbox:  http://localhost:4000   (fake hosted checkout, test cards only)
# Attack demo (runs once, ~4 minutes, only against this local store):
#   docker compose --profile attack run --rm attack-simulator
#
# Telemetry goes to PulseOps on your machine (http://localhost:8000) if it is running.

x-payment-secrets: &payment-secrets
  TESTPAY_SECRET_KEY: ${TESTPAY_SECRET_KEY:-tp_sk_demo_change_me_8f2c1d}
  TESTPAY_WEBHOOK_SECRET: ${TESTPAY_WEBHOOK_SECRET:-tp_whsec_demo_change_me_4b7e9a}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securecart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securecart}
      POSTGRES_DB: securecart
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securecart"]
      interval: 3s
      retries: 20

  testpay:
    build: ./testpay
    environment:
      <<: *payment-secrets
      PORT: "4000"
      TESTPAY_PUBLIC_URL: http://localhost:4000
      STORE_WEBHOOK_URL: http://app:3000/api/webhooks/testpay
      STORE_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]

  app:
    build: ./app
    image: securecart:latest
    environment:
      <<: *payment-secrets
      DATABASE_URL: postgres://securecart:${POSTGRES_PASSWORD:-securecart}@db:5432/securecart
      APP_ORIGIN: http://localhost:3000
      # 32 random bytes, base64. Encrypts two-factor secrets at rest. Generate your own with:
      #   openssl rand -base64 32
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-UzRd8lcbRR1SM1phWOyh+ZSikIBwoN/J17In+6EEuWw=}
      DEMO_MODE: "true"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-testpay}
      TESTPAY_API_URL: http://testpay:4000
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin-Demo-Pass-2026}
      SEED_DEMO_USERS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${PULSEOPS_URL:-http://host.docker.internal:8000}
      OTEL_SERVICE_NAME: securecart
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      testpay: { condition: service_started }

  attack-simulator:
    image: securecart:latest
    profiles: ["attack"]
    command: node scripts/simulate-attacks.mjs
    environment:
      TARGET: http://app:3000
      TESTPAY_URL: http://testpay:4000
    depends_on:
      app: { condition: service_healthy }

volumes:
  dbdata:
